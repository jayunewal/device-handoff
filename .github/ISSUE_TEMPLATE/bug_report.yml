name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `baton --version`, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms involved
      multiple: true
      options: [macOS, Windows, Linux, iOS, iPadOS, Android]
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: How were the devices connected?
      options: [Same Wi-Fi or LAN, Different networks (internet), Not sure]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: In the app, tap the three dots on the Devices tab, choose Diagnostics, tap Copy and paste it here. Pairing codes, public IP addresses and the account name in a path are left out of it already. Read it first and remove anything else you would rather not share. For the command-line program, run with `RUST_LOG=baton=debug` and remove anything private (names, addresses, folders) before pasting.
      render: text
