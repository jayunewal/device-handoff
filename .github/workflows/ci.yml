name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request ends the run of the older one. A run on main is left to end:
  # the caches that every pull request starts from are saved when the run succeeds, and merges
  # that come close together would cancel each run before it got there. At most one run waits
  # behind the one that is running, so this costs one more run, not one for each merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug information. A build takes a third less time and a cache is a third of the size,
  # and a failed test still says where it failed, because that is not read from debug
  # information. The builds that Xcode starts get the same through a file: see "Set up Cargo".
  CARGO_PROFILE_DEV_DEBUG: "0"

# Every job that builds Rust keeps its dependencies from one run to the next (Swatinem/rust-cache),
# and only a run on main saves them. GitHub keeps 10 GB of caches for the whole repository and
# drops the ones that were used longest ago when there are more. The twelve entries of a set are
# 200 to 700 MB each, and the Flutter SDK is another 2 GB, so a second set does not fit: when
# every pull request saved a set of its own, the copies pushed out each other and the set that
# every pull request starts from. A pull request that changes Cargo.lock builds the new
# dependencies in each of its runs, and the run on main after the merge saves them.
jobs:
  # Chooses which of the jobs below a change can affect, so that a change to the Mac app does not
  # also run the Rust workspace on three systems. A push to main and a run started by hand run
  # everything, because the downloads are built there. The rules are in
  # .github/scripts/changed-paths.sh, and "What CI runs" in CONTRIBUTING.md says them in words.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.choose.outputs.rust }}
      app: ${{ steps.choose.outputs.app }}
      mac: ${{ steps.choose.outputs.mac }}
      iphone: ${{ steps.choose.outputs.iphone }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The paths of a pull request are the ones between the commit it branched from and
          # its last commit, which needs the history.
          fetch-depth: 0
      - name: Check the rules against the changes people really make
        run: bash .github/scripts/changed-paths-test.sh
      # The iPhone job uses this script, and no other job could tell that it was broken.
      - name: Check the script that starts a hung test again
        run: bash .github/scripts/hang-guard-test.sh
      - name: Choose the jobs
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          everything() {
            printf 'rust=true\napp=true\nmac=true\niphone=true\n' | tee -a "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" != pull_request ]; then
            echo "This is not a pull request, so every job runs."
            everything
            exit 0
          fi
          if ! paths=$(git -c core.quotepath=false diff --no-renames --name-only "$BASE...$HEAD"); then
            echo "::warning::Could not list the files that this pull request changes, so every job runs."
            everything
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$paths"
          if ! answer=$(printf '%s\n' "$paths" | bash .github/scripts/changed-paths.sh); then
            echo "::warning::Could not tell which jobs the change affects, so every job runs."
            everything
            exit 0
          fi
          printf '%s\n' "$answer" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # For the last step only.
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,aarch64-apple-ios,aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # What people build has only the default features, and code that is compiled in one set
      # and not the other can hide a warning, so lint that set as well.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Windows, Apple and Android code of `baton-fs` is not compiled on Linux, and the Mac and
      # Windows jobs below do not deny warnings, so nothing else would lint it. Linting for another
      # target needs no linker and no SDK.
      - run: |
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin aarch64-apple-ios aarch64-linux-android; do
            cargo clippy -p baton-fs --all-targets --locked --target "$target" -- -D warnings
          done

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-toolchain.toml pins "stable" for local work and takes precedence over the
      # toolchain the action installs as the rustup default. Naming the toolchain on the
      # command line overrides the file, so this really builds with the MSRV.
      - run: cargo +${{ steps.msrv.outputs.version }} --version
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --locked

  docs:
    name: Rustdoc
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: Licenses and advisories
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  app:
    name: App (Flutter, Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The code generator formats what it writes with rustfmt.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@v2
        with:
          # The version in apps/baton/README.md. The app moves to a newer Flutter on purpose,
          # not because one came out.
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Install the bridge code generator
        # The same version as the flutter_rust_bridge crate and package.
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Fetch the app's packages
        working-directory: apps/baton
        run: flutter pub get --enforce-lockfile
      - name: Check that the generated bridge is up to date
        working-directory: apps/baton
        run: |
          set -eu
          flutter_rust_bridge_codegen generate
          # The generator formats the Rust it writes with whichever rustfmt is installed, and
          # the Format job holds the committed file to the newest stable one.
          cargo fmt --all
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "The generated bridge is out of date. Run flutter_rust_bridge_codegen generate in apps/baton and commit the result." >&2
            exit 1
          fi
      - name: Analyze and check formatting
        working-directory: apps/baton
        run: |
          set -eu
          flutter analyze
          dart format --output=none --set-exit-if-changed lib/main.dart lib/src/*.dart lib/src/screens test integration_test
      - name: Build the library that the tests load
        run: cargo build -p baton-ffi --locked
      - name: Test
        working-directory: apps/baton
        env:
          BATON_FFI_LIB: ${{ github.workspace }}/target/debug/libbaton_ffi.so
        run: flutter test

  # The two jobs below build the app for the Mac and for the iPhone and iPad, and start it. They
  # are the only place where the build settings of apps/baton/ios and apps/baton/macos, and the
  # way Cargokit builds the Rust library into them, meet a real Xcode.
  #
  # Mac jobs are the ones that wait: GitHub runs five of them at a time for the whole repository,
  # and a run needs four. So these two keep what Cargo builds for the library (the dependencies,
  # which are most of it) from one run to the next, and the iPhone job builds its simulator for
  # one processor.
  app-mac:
    name: App (macOS)
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The app is built for both kinds of Mac, and Cargokit makes one library of the two.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The folder that Cargokit builds in: apps/baton/rust_builder/README.md says why.
          workspaces: ". -> apps/baton/build/cargokit"
      - name: Set up Cargo
        # Xcode does not hand the environment of this job to the scripts it runs, and Cargokit
        # starts Cargo from one of them. A file that Cargo reads by itself gets there.
        run: |
          mkdir -p ~/.cargo
          printf '[build]\nincremental = false\n\n[profile.dev]\ndebug = 0\n' >> ~/.cargo/config.toml
          # What the cache restored is older than this file, and the last step of the job counts
          # what is newer.
          touch "$RUNNER_TEMP/cargo-set-up"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Fetch the app's packages
        working-directory: apps/baton
        run: flutter pub get --enforce-lockfile
      - name: Test the Swift that shows and shares windows
        # BatonViewer.swift and BatonSource.swift build on any computer. The tests of the decoder
        # and the encoder need VideoToolbox, and the picker and the capture (BatonCapture.swift)
        # need ScreenCaptureKit, which this Mac has (apps/baton/rust_builder/swift_tests). The
        # second and the third run look for a race between the threads of the Rust side, of the
        # decoder, of the encoder and of the screen, and for a read or a write beyond what was
        # passed. They do not look for leaks: the table that is registered stays for as long as the
        # process lives, and every test registers one.
        working-directory: apps/baton/rust_builder/swift_tests
        run: |
          ./run.sh
          ./run.sh -sanitize=thread
          ./run.sh -sanitize=address
      - name: Build the app
        working-directory: apps/baton
        run: flutter build macos --release
      - name: Check that the library is in the app, with the functions that the app looks up
        run: |
          set -eu
          lib=apps/baton/build/macos/Build/Products/Release/Baton.app/Contents/Frameworks/baton_ffi.framework/Versions/A/baton_ffi
          lipo -archs "$lib"
          for symbol in \
            frb_get_rust_content_hash frb_pde_ffi_dispatcher_primary frb_init_frb_dart_api_dl \
            baton_stream_abi_version baton_stream_register_viewer baton_stream_link_decode_failed \
            baton_stream_register_sharer baton_stream_pick_done baton_stream_source_clock \
            baton_stream_source_begin baton_stream_source_cancel \
            baton_stream_source_recovery_pending baton_stream_source_sent \
            baton_stream_source_new_epoch baton_stream_source_changed \
            baton_stream_source_pause baton_stream_source_resume \
            baton_stream_source_end; do
            nm -gU "$lib" | grep -q " _$symbol\$" || { echo "$symbol is missing from $lib" >&2; exit 1; }
          done
      - name: Check that the app is sandboxed, and may use the network both ways, the camera and Downloads
        run: |
          set -eu
          app=apps/baton/build/macos/Build/Products/Release/Baton.app
          codesign -d --entitlements - "$app" > entitlements.txt 2>&1
          for key in com.apple.security.app-sandbox com.apple.security.network.client com.apple.security.network.server com.apple.security.device.camera com.apple.security.files.downloads.read-write com.apple.security.files.user-selected.read-only; do
            grep -q "$key" entitlements.txt || { cat entitlements.txt; echo "$key is missing from the entitlements of $app" >&2; exit 1; }
          done
      - name: Check that the guard of the privacy mode is in the app, for the same processors, signed to inherit the sandbox
        # The app looks for it by name, inside itself, when a phone starts a private session, and a
        # build without it refuses that session. It runs only when the sandbox of the app is its
        # own, so a program that is signed with more or with less than these two entitlements
        # would end at once, on a person's Mac.
        run: |
          set -eu
          app=apps/baton/build/macos/Build/Products/Release/Baton.app
          guard="$app/Contents/MacOS/BatonGuard"
          test -x "$guard" || { echo "$guard is missing" >&2; exit 1; }
          guard_archs=$(lipo -archs "$guard" | tr ' ' '\n' | sort | tr '\n' ' ')
          app_archs=$(lipo -archs "$app/Contents/MacOS/Baton" | tr ' ' '\n' | sort | tr '\n' ' ')
          echo "the guard is built for: $guard_archs; the app for: $app_archs"
          [ "$guard_archs" = "$app_archs" ] || { echo "the guard and the app are built for different processors" >&2; exit 1; }
          codesign -d --entitlements - "$guard" > guard-entitlements.txt 2>&1
          for key in com.apple.security.app-sandbox com.apple.security.inherit; do
            grep -q "$key" guard-entitlements.txt || { cat guard-entitlements.txt; echo "$key is missing from the entitlements of $guard" >&2; exit 1; }
          done
          keys=$(grep -o 'com\.apple\.[A-Za-z0-9._-]*' guard-entitlements.txt | sort -u | tr '\n' ' ')
          [ "$keys" = "com.apple.security.app-sandbox com.apple.security.inherit " ] || {
            cat guard-entitlements.txt
            echo "the guard has an entitlement besides the two that let it inherit the sandbox" >&2
            exit 1
          }
          codesign -dv "$guard" 2>&1 | grep -q "Identifier=io.github.jayunewal.baton.guard" || { echo "the guard has another identifier" >&2; exit 1; }
          # The signature of the app seals the guard, so a guard that was signed after it, or not at
          # all, fails here.
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Start the app on this Mac
        timeout-minutes: 25
        working-directory: apps/baton
        run: |
          # A person's Mac has a Downloads folder, and the app puts what other devices send there.
          # The test checks that the app found that one and not the one inside its sandbox.
          mkdir -p ~/Downloads
          flutter test integration_test -d macos
      # The app is a download like the program that the Build jobs make: a run for a pull request
      # does not make it.
      - name: Package the app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent apps/baton/build/macos/Build/Products/Release/Baton.app Baton-macos-app.zip
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: baton-app-macos
          path: Baton-macos-app.zip
          if-no-files-found: error
          retention-days: 30
      - name: Say how much of the Rust build came from the cache
        if: always()
        run: bash .github/scripts/cargokit-cache-report.sh

  app-iphone:
    name: App (iPhone)
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # An iPhone or iPad, and the simulator of this Mac.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The folder that Cargokit builds in: apps/baton/rust_builder/README.md says why.
          workspaces: ". -> apps/baton/build/cargokit"
      - name: Set up Cargo
        # Xcode does not hand the environment of this job to the scripts it runs, and Cargokit
        # starts Cargo from one of them. A file that Cargo reads by itself gets there.
        run: |
          mkdir -p ~/.cargo
          printf '[build]\nincremental = false\n\n[profile.dev]\ndebug = 0\n' >> ~/.cargo/config.toml
          # What the cache restored is older than this file, and the last step of the job counts
          # what is newer.
          touch "$RUNNER_TEMP/cargo-set-up"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Fetch the app's packages
        working-directory: apps/baton
        run: flutter pub get --enforce-lockfile
      - name: Build the app for an iPhone
        # Nothing signs it, so it cannot be installed from here. Whoever installs it builds it
        # on their own Mac, with their own Apple ID; docs/install-the-app.md says how.
        working-directory: apps/baton
        run: flutter build ios --release --no-codesign
      - name: Check that the library is in the app, with the functions that the app looks up
        run: |
          set -eu
          lib=apps/baton/build/ios/iphoneos/Runner.app/Frameworks/baton_ffi.framework/baton_ffi
          lipo -archs "$lib"
          for symbol in \
            frb_get_rust_content_hash frb_pde_ffi_dispatcher_primary frb_init_frb_dart_api_dl \
            baton_stream_abi_version baton_stream_register_viewer baton_stream_link_decode_failed \
            baton_stream_register_sharer baton_stream_pick_done baton_stream_source_clock \
            baton_stream_source_begin baton_stream_source_cancel \
            baton_stream_source_recovery_pending baton_stream_source_sent \
            baton_stream_source_new_epoch baton_stream_source_changed \
            baton_stream_source_pause baton_stream_source_resume \
            baton_stream_source_end; do
            nm -gU "$lib" | grep -q " _$symbol\$" || { echo "$symbol is missing from $lib" >&2; exit 1; }
          done
      - name: Start an iPhone simulator
        # Booting it beside the other steps was tried, at the top of the job and before the build
        # of the app. The steps beside it took about as much longer as the boot takes alone (the
        # installation of Rust went from 12 seconds to 176), so nothing was gained. A simulator
        # that cannot start fails this step, not the job's hour.
        timeout-minutes: 10
        run: |
          set -eu
          udid=$(xcrun simctl list devices available | grep 'iPhone' | tail -n 1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "Simulator: $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b
      - name: Start the app in the simulator
        timeout-minutes: 25
        working-directory: apps/baton
        env:
          # Only the simulator of this Mac is used. Left alone, a debug build of the pods is made
          # for the simulator of an Intel Mac as well, which doubles what Cargo and the compilers
          # do. This file reaches every target, the pods included, and Xcode reads it by itself.
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/simulator.xcconfig
        run: |
          set -eu
          printf 'ARCHS[sdk=iphonesimulator*] = %s\n' "$(uname -m)" > "$XCODE_XCCONFIG_FILE"
          # Now and then Flutter never finds the app that it started in the simulator, and says
          # nothing more until the 25 minutes of this step are over. In a run that passed it
          # printed the first of the two lines below and, 2.6 seconds later, the second. A second
          # start nearly always finds the app. Before it starts again, the app is stopped and the
          # report below is printed, so that a run that passed on the second start still says
          # what went wrong in the first.
          python3 "$GITHUB_WORKSPACE/.github/scripts/hang-guard.py" \
            --waiting 'Waiting for VM Service port to be available' \
            --finished 'VM Service URL on device' \
            --seconds 120 \
            --cleanup 'xcrun simctl terminate "$SIMULATOR_UDID" io.github.jayunewal.baton; bash "$GITHUB_WORKSPACE/.github/scripts/simulator-report.sh"' \
            -- flutter test integration_test -d "$SIMULATOR_UDID" -v
      - name: Show what the simulator logged about the app
        # An app that closes as it opens leaves the test waiting for a window that never comes.
        # The script says why it may have. The guard around the test runs it too.
        if: failure()
        run: bash .github/scripts/simulator-report.sh
      - name: Say how much of the Rust build came from the cache
        if: always()
        run: bash .github/scripts/cargokit-cache-report.sh

  # The downloads: the `baton` program for each system, packed with the try-it guide. A pull
  # request does not build them, which leaves it one Mac job fewer. A push to main and a run
  # started by hand do, so the downloads of a branch come from starting CI by hand on it.
  build:
    name: Build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: baton-macos
          - name: Windows
            os: windows-latest
            artifact: baton-windows
          # An older Ubuntu, so that the program runs on any distribution with a glibc this
          # old or newer.
          - name: Linux
            os: ubuntu-22.04
            artifact: baton-linux
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both kinds of Mac, joined into one program below.
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test (macOS)
        if: matrix.name == 'macOS'
        run: |
          set -eu
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p baton-cli --target "$target"
          done
          # The end-to-end tests run the program that was just built, on this Mac's own
          # processor.
          cargo test --release --locked -p baton-cli --test e2e --target aarch64-apple-darwin
          mkdir dist
          lipo -create -output dist/baton \
            target/aarch64-apple-darwin/release/baton target/x86_64-apple-darwin/release/baton
          # Apple Silicon will not run code that has no signature at all. This one is not
          # signed by anyone, which is enough to run it but not to be trusted by default.
          codesign --force --sign - dist/baton
      - name: Build and test (Windows)
        if: matrix.name == 'Windows'
        shell: bash
        env:
          # Link the C runtime into the program, so that it needs nothing installed.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -eu
          cargo build --release --locked -p baton-cli
          cargo test --release --locked -p baton-cli --test e2e
          mkdir dist
          cp target/release/baton.exe dist/
      - name: Build and test (Linux)
        if: matrix.name == 'Linux'
        run: |
          set -eu
          cargo build --release --locked -p baton-cli
          cargo test --release --locked -p baton-cli --test e2e
          mkdir dist
          cp target/release/baton dist/
      - name: Check that the program starts
        shell: bash
        run: |
          set -eu
          exe=dist/baton
          if [ "${{ matrix.name }}" = Windows ]; then exe=dist/baton.exe; fi
          "$exe" --version
          "$exe" --help > /dev/null
          file "$exe" || true
      - name: Package
        shell: bash
        run: |
          set -eu
          cp docs/try-it.md dist/TRY-IT.md
          cp LICENSE dist/LICENSE
          if [ "${{ matrix.name }}" = Windows ]; then
            # A zip is what Windows opens without help, and GitHub zips the artifact itself.
            echo "UPLOAD_PATH=dist" >> "$GITHUB_ENV"
          else
            # A tar file keeps the program's executable bit, which an artifact's zip would drop.
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist baton TRY-IT.md LICENSE
            echo "UPLOAD_PATH=${{ matrix.artifact }}.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.UPLOAD_PATH }}
          if-no-files-found: error
          retention-days: 30
