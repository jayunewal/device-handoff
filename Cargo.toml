[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Follows iroh's minimum supported Rust version. CI checks it.
rust-version = "1.91"
license = "Apache-2.0"
authors = ["The Baton contributors"]
publish = false

[workspace.dependencies]
# Internal
baton-app = { path = "crates/baton-app" }
baton-core = { path = "crates/baton-core" }
baton-fs = { path = "crates/baton-fs" }
baton-proto = { path = "crates/baton-proto" }
baton-stream = { path = "crates/baton-stream" }

# External. Versions are requirements; Cargo.lock pins what is actually built.
# `image-data` (a default feature) is only for pictures, which Baton does not copy yet.
arboard = { version = "3.6", default-features = false }
blake3 = { version = "1.8", default-features = false, features = ["zeroize"] }
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
directories = "6"
getrandom = "0.4"
gethostname = "1"
# Only for the normalisation forms of Unicode, with the data compiled in. The build already has it
# for the DNS code that iroh uses.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# `fast-apple-datapath` (a default feature) calls private Apple system calls, which the
# App Store rejects, so it stays off. `portmapper` asks the router for a port mapping.
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
iroh-mdns-address-lookup = "0.6"
# Newer than 0.2.189 takes `in6_ifreq` away from iOS, and `netdev` (which iroh uses) needs it
# there, so nothing builds for iPhone or iPad. Lift the bound once `netdev` has a release
# that builds against the newest libc.
libc = ">=0.2.186, <0.2.190"
open = "5.4"
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
url = "2"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Network input is untrusted: a panic in a parser is a remote denial of service.
# Library code returns errors instead. Tests may use all of these (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Pedantic lints that cost more noise than they save in this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[profile.release]
lto = "thin"
strip = true
