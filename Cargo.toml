[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Follows iroh's minimum supported Rust version. CI checks it.
rust-version = "1.91"
license = "Apache-2.0"
authors = ["The Baton contributors"]
publish = false

[workspace.dependencies]
# Internal
baton-proto = { path = "crates/baton-proto" }

# External. Versions are requirements; Cargo.lock pins what is actually built.
blake3 = { version = "1.8", default-features = false }
ciborium = "0.2"
data-encoding = "2.11"
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Network input is untrusted: a panic in a parser is a remote denial of service.
# Library code returns errors instead. Tests may use all of these (see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Pedantic lints that cost more noise than they save in this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[profile.release]
lto = "thin"
strip = true
