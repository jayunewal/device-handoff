[package]
name = "baton-stream-abi"
description = "The small C interface through which the platform code of a device (Swift on an Apple device) shows the windows of other devices: the functions it calls, the functions it provides, and the checks that stand between them and the Rust side."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# This crate holds the `unsafe` code of the interface to the platform (see lib.rs). Unlike most
# of the workspace it therefore cannot say `workspace = true`: the workspace forbids
# `unsafe_code`, and a forbid cannot be lifted. Here it is denied everywhere except in the two
# modules that cross the interface (`platform` and `exports`) and in the tests that play the
# platform. Keep every other line equal to [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[dependencies]
baton-app.workspace = true
baton-core.workspace = true
baton-proto.workspace = true
baton-stream.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
toml.workspace = true
