[package]
name = "baton-ffi"
description = "The bridge between the Flutter app and baton-app. Its glue code is generated by flutter_rust_bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "baton_ffi"
# `staticlib` is what the iOS and macOS apps link, `cdylib` is what Android and the Dart tests
# load, and `lib` lets Cargo check and test the crate like any other.
crate-type = ["cdylib", "staticlib", "lib"]

# This crate may hold `unsafe` code, because the glue that flutter_rust_bridge generates is
# full of it. Unlike the rest of the workspace it therefore cannot say `workspace = true`: the
# workspace forbids `unsafe_code`, and a forbid cannot be lifted. Here it is denied everywhere
# except on the generated module (see lib.rs). Keep every other line equal to
# [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# The macros of flutter_rust_bridge test for this cfg while expanding.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[dependencies]
baton-app.workspace = true
# The platform code of the device registers the viewer for windows through this crate's C
# functions, which the library then exports, and the app is started with what it registered.
baton-stream-abi.workspace = true
# The same version as flutter_rust_bridge in apps/baton/pubspec.yaml and as the code
# generator that wrote src/frb_generated.rs: the three must match exactly.
flutter_rust_bridge = "=2.13.0"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
toml.workspace = true
