[package]
name = "baton-core"
description = "Platform-neutral core of Baton: device identity, trust store, pairing and handoff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Helpers for tests: an in-process relay server and the option to trust its self-signed
# certificate. Never enable this in a released binary.
test-support = ["iroh/test-utils"]

[dependencies]
baton-fs.workspace = true
baton-proto.workspace = true
baton-stream.workspace = true
blake3.workspace = true
data-encoding.workspace = true
directories.workspace = true
getrandom.workspace = true
gethostname.workspace = true
icu_normalizer.workspace = true
iroh.workspace = true
iroh-base.workspace = true
iroh-mdns-address-lookup.workspace = true
# Not used here: this only holds back the version of libc that the whole build uses (see
# the workspace Cargo.toml).
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The crate's own tests use the test helpers.
baton-core = { path = ".", features = ["test-support"] }
ciborium.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }

