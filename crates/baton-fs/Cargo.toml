[package]
name = "baton-fs"
description = "File system calls that Baton needs and the standard library does not have: moving a file or a folder without replacing, marking a received file, hiding a folder, asking how much room a volume has, and making an open file wait for its data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# This crate holds the `unsafe` code of the system calls it makes (see lib.rs). Unlike
# most of the workspace it therefore cannot say `workspace = true`: the workspace forbids
# `unsafe_code`, and a forbid cannot be lifted. Here it is denied everywhere except in the one
# module that makes the calls (`sys`). Keep every other line equal to [workspace.lints] in the
# root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# The version of libc is held back by the workspace, see Cargo.toml in the root. Windows needs
# no crate: the one call it makes is declared in sys.rs.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
