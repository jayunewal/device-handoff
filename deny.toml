# Dependency policy, checked in CI by cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check platform-specific dependencies for every platform Baton ships on, not only the host.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]
all-features = true

[advisories]
# Known-vulnerable crates fail the build. Add an entry here only with a comment that
# explains why the advisory does not apply to Baton.
ignore = []

[licenses]
# Permissive licenses only. See docs/adr/0004-apache-2-license.md.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The allow-list is a policy, not an inventory of what is currently in the tree.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version requirement.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
